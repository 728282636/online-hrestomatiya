<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чтение · Детская хрестоматия</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="logo">Детская хрестоматия</a>
    <div class="topbar-actions">
      <button id="kidsToggle" class="btn btn-toggle">Детский режим</button>
    </div>
  </header>

  <main class="container reader-container">
    <a href="#" class="back-link" id="topBackLink">← Вернуться к списку произведений</a>

    <article class="reader">
      <h1 id="title"></h1>
      <p id="author" class="reader-author"></p>
      <p id="meta" class="reader-meta"></p>

      <div class="reader-toolbar">
        <button id="speakBtn" class="btn btn-primary">Читать вслух</button>
        <button id="stopBtn" class="btn">Остановить</button>
        <div class="font-controls">
          <button id="fontMinus" class="btn btn-round">A−</button>
          <button id="fontPlus" class="btn btn-round">A+</button>
        </div>
      </div>

      <div id="text" class="reader-text"></div>

      <section id="questions" class="questions hidden">
        <h2>Вопросы после чтения</h2>
        <ol id="questionsList"></ol>
      </section>

      <div class="reader-footer">
        <a href="#" class="back-link" id="bottomBackLink">← Вернуться к списку произведений</a>
      </div>
    </article>
  </main>

  <footer class="footer">
    <p>Тексты — в общественном достоянии. Учебный проект.</p>
  </footer>

  <script src="core.js"></script>
  <script src="read.js"></script>
</body>
</html>
