<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чтение · Литературная хрестоматия</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container reader-container" style="padding-top: 40px;">
    <div class="reader-nav-top">
      <a href="index.html" class="back-link">← Вернуться к списку авторов</a>
      <a href="#" class="back-link" id="topBackLink">← Вернуться к списку произведений</a>
    </div>

    <article class="reader">
      <h1 id="title"></h1>
      <p id="author" class="reader-author"></p>
      <p id="meta" class="reader-meta"></p>

      <div class="reader-toolbar">
        <div class="font-controls">
          <button id="fontMinus" class="btn btn-round">A−</button>
          <button id="fontPlus" class="btn btn-round">A+</button>
        </div>
      </div>

      <div id="text" class="reader-text"></div>

      <section id="questions" class="questions hidden">
        <h2>Вопросы после чтения</h2>
        <ol id="questionsList"></ol>
      </section>

      <div class="reader-nav-bottom">
        <a href="index.html" class="back-link">← Вернуться к списку авторов</a>
        <a href="#" class="back-link" id="bottomBackLink">← Вернуться к списку произведений</a>
      </div>
    </article>
  </main>

  <script src="core.js"></script>
  <script src="read.js"></script>
</body>
</html>
